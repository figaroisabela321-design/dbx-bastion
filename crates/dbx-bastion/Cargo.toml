[package]
name = "dbx-bastion"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "DB Bastion security domain: auth/session principals, assets, RBAC, SQL policy, approvals, audit and the query gateway boundary. Storage is isolated from DBX core."

[dependencies]
# Same rusqlite line as the DBX workspace (0.32) plus `bundled` so this crate
# builds standalone (`cargo check -p dbx-bastion`) without system sqlite3
# headers. `bundled` does not conflict with dbx-core's
# `bundled-sqlcipher-vendored-openssl`: that feature already implies `bundled`.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "sync", "time"] }
# SQL AST for the gateway analyzer (TASK-005A). Same version dbx-sql-core
# uses (0.62.0); default features are enough (no `visitor` needed — the
# analyzer walks the AST with its own explicit match arms so that an
# unhandled shape fails closed instead of being silently skipped).
sqlparser = "0.62"
# CancellationToken for the TASK-005B executor contract (same version dbx-core uses).
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Tests assert on sqlite_master directly through the same rusqlite version.
rusqlite = { version = "0.32", features = ["bundled"] }
